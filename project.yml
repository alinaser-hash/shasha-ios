name: ShashaIOS
options:
  bundleIdPrefix: app.shasha
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.5"
    CURRENT_PROJECT_VERSION: "8"
targets:
  ShashaIOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - Logic/Sources/PlaybackLogic
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "شاشة"
        # Without these XcodeGen writes fixed "1.0" / "1" into Info.plist.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        UILaunchScreen: {}
        ShashaCredit: "$(SHASHA_CREDIT)"
        NSFaceIDUsageDescription: "لفتح المجموعات التي قفلتها في شاشة."
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "للوصول إلى خوادم القوائم على الشبكة المحلية."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shasha.ios
        PRODUCT_NAME: ShashaIOS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PiP/Shasha-Bridging-Header.h
        SHASHA_CREDIT: ""
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_BITCODE: "NO"
