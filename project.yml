name: ShashaIOS
options:
  bundleIdPrefix: app.shasha
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "8"
targetTemplates:
  App:
    type: application
    platform: iOS
    info:
      path: Support/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: "$(SHASHA_DISPLAY_NAME)"
        # Without these XcodeGen writes fixed "1.0" / "1" into Info.plist.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        UILaunchScreen: {}
        ShashaCredit: "$(SHASHA_CREDIT)"
        NSFaceIDUsageDescription: "لفتح المجموعات التي قفلتها في شاشة."
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "للوصول إلى خوادم القوائم على الشبكة المحلية."
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        SHASHA_CREDIT: ""
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_BITCODE: "NO"

targets:
  # Main app: MobileVLCKit 3 (same engine as the official VLC app).
  ShashaIOS:
    templates: [App]
    sources:
      - path: Sources
        excludes: ["PiP/**"]
      - Resources
      - Logic/Sources/PlaybackLogic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shasha.ios
        PRODUCT_NAME: ShashaIOS
        SHASHA_DISPLAY_NAME: "شاشة"
  # Second app: VLCKit 4 alpha with picture in picture. Installs next to the main one.
  ShashaPiP:
    templates: [App]
    sources:
      - Sources
      - Resources
      - Logic/Sources/PlaybackLogic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shasha.ios.pip
        PRODUCT_NAME: ShashaPiP
        SHASHA_DISPLAY_NAME: "شاشة PiP"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) VLC4"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PiP/Shasha-Bridging-Header.h
