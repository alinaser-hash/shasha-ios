name: Probe VLCKit 4 headers

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-vlc4.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  headers:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Fetch VLCKit 4 and copy its public headers
        run: |
          mkdir p && cd p
          cat > Podfile <<'POD'
          platform :ios, '16.0'
          install! 'cocoapods', :integrate_targets => false
          target 'X' do
            pod 'VLCKit', '4.0.0a18'
          end
          POD
          pod install --repo-update > ../pod.log 2>&1 || true
          cd ..
          mkdir -p out
          cp pod.log out/
          find p/Pods -path "*ios-arm64/*" -name "*.h" -path "*Headers*" | head -100 > out/list.txt || true
          for f in $(find p/Pods -path "*ios-arm64/*" -name "*.h" -path "*Headers*"); do cp "$f" out/; done
          ls out > out/files.txt
          git config user.name shasha-ci; git config user.email ci@users.noreply.github.com
          cd out && git init -q && git add -A && git commit -qm headers
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-vlc4
