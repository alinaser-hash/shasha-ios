name: Build IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 70
    env:
      SHASHA_CREDIT: ${{ secrets.SHASHA_CREDIT }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        run: |
          set -o pipefail
          {
            echo "== xcode"; xcodebuild -version
            echo "== unit tests (PlaybackLogic)"
            swift test --package-path Logic
            brew install xcodegen
            xcodegen generate
            pod install --repo-update
            for scheme in ShashaIOS ShashaPiP; do
              echo "== build $scheme"
              xcodebuild -workspace ShashaIOS.xcworkspace -scheme $scheme -configuration Release \
                -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SHASHA_CREDIT="$SHASHA_CREDIT" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
            done
          } 2>&1 | tee all.log

      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          for app in ShashaIOS ShashaPiP; do
            rm -rf Payload && mkdir Payload
            cp -R build/Build/Products/Release-iphoneos/$app.app Payload/
            out=$([ "$app" = ShashaIOS ] && echo Shasha-unsigned.ipa || echo Shasha-PiP-unsigned.ipa)
            zip -qry "$out" Payload
            ls -la "$out"
          done

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: Shasha-unsigned-ipa
          path: |
            Shasha-unsigned.ipa
            Shasha-PiP-unsigned.ipa
          retention-days: 3

      # Short result + errors on the ci-logs branch (read by the developer with git, no API needed).
      - name: Publish build summary
        if: always()
        run: |
          {
            echo "run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA outcome=${{ steps.build.outcome }}"
            for app in ShashaIOS ShashaPiP; do echo "$app:"; plutil -p build/Build/Products/Release-iphoneos/$app.app/Info.plist 2>/dev/null | grep -E "CFBundle(ShortVersionString|Version|DisplayName|Identifier)\"" || true; done
            echo "== errors"; grep -E "error:|fatal error|Undefined symbol|ld: |\*\* BUILD|\[!\]|failed \(|Executed [0-9]+ test" all.log | head -200 || true
            echo "== tail"; tail -60 all.log || true
          } > ci-summary.txt
          git config user.name "shasha-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          git add -f ci-summary.txt
          git commit -qm "build $GITHUB_RUN_NUMBER: ${{ steps.build.outcome }}"
          git push -qf origin HEAD:ci-logs
